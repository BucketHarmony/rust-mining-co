name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Full debuginfo on ~30 Bevy test binaries fills the Linux runner's disk and makes Windows links crawl.
  # Line tables keep file:line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  PROPTEST_CASES: "1000"
  # CI runs a short soak for the SAD invariants; scripts/soak.sh runs the full 3,600 frames.
  RMC_SOAK_FRAMES: "300"

# Why the jobs are split: `cargo test -p <pkg>` resolves features for that package alone, so
# verify-features.sh and e2e.sh each rebuild Bevy with a different feature set than
# `cargo test --workspace`. Each build is ~20 min and ~8 GB on a 2-core runner; one job cannot
# hold them all in time or disk.
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: System deps (Bevy + lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools jq
          vulkaninfo --summary | grep -iE "llvmpipe|deviceName" || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/check-no-bevy.sh
      - run: cargo test --workspace
      - name: Disk left
        if: always()
        run: df -h /

  linux-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Three extra Bevy builds; no debuginfo keeps them inside the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: System deps (Bevy + lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools jq
      - name: Feature regression check
        run: scripts/verify-features.sh --quick
      - name: Disk left
        if: always()
        run: df -h /

  linux-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      # The whole suite takes ~38 min on a desktop CPU and ~8x that on a 2-core runner, so CI runs one
      # scenario per area: boot and initial load, dig and remesh, editor brush, lighting, latency, save/load.
      # pass-feature.sh and verify-features.sh --all run every scenario.
      RMC_CI_E2E: boot_renders dig_cell_visible editor_brush_sphere glow_in_cave latency_dig save_load_roundtrip
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: System deps (Bevy + lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers vulkan-tools jq
          vulkaninfo --summary | grep -iE "llvmpipe|deviceName" || true
      - name: Build scenarios
        run: cargo test -p rmc_e2e --tests --no-run
      - name: End-to-end (lavapipe)
        if: hashFiles('tests/e2e/tests/*.rs') != ''
        run: |
          rc=0
          for s in $RMC_CI_E2E; do
            echo "::group::$s"
            scripts/e2e.sh "$s" || { echo "::error::E2E failed: $s"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-linux
          path: target/e2e/*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # rust-lld links the Bevy test binaries far faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install WARP (software D3D12)
        shell: pwsh
        run: |
          nuget install Microsoft.Direct3D.WARP -Version 1.0.16.1 -OutputDirectory warp
          $dll = Get-ChildItem -Recurse warp -Filter d3d10warp.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          New-Item -ItemType Directory -Force target\debug\deps | Out-Null
          Copy-Item $dll.FullName target\debug\
          Copy-Item $dll.FullName target\debug\deps\
      # The game binary is built by windows-release; this builds the client, testkit and scenarios.
      - name: Build scenarios
        run: cargo test -p rmc_e2e --tests --no-run
      # boot_renders alone is ~15 min on WARP with 2 cores; the Linux job covers the other areas.
      - name: End-to-end (WARP)
        if: hashFiles('tests/e2e/tests/*.rs') != ''
        shell: bash
        env:
          WGPU_BACKEND: dx12
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: scripts/e2e.sh boot_renders
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-windows
          path: target/e2e/*.png
          if-no-files-found: ignore

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Release build
        run: cargo build --release -p rmc_app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\rmc_app.exe dist\rust-mining-co.exe
          Copy-Item -Recurse assets dist\assets
          if (Test-Path docs\CONTROLS.md) { Copy-Item docs\CONTROLS.md dist\ }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/
